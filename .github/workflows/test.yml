name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q src/tracebook
      - name: Smoke-test installed CLI
        run: ctf-tracebook --help > /dev/null
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: ctf-tracebook --version
      - run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Evaluate transcript fixtures
        run: python scripts/evaluate_transcripts.py benchmarks/transcripts.json --output transcript-benchmark.json --fail-on-regression
      - name: Build trace-record JSON
        run: ctf-tracebook examples/debug-session.txt --format json > trace-record.json
      - name: Validate trace-record schema
        run: python scripts/validate_json_schema.py schemas/trace-record.schema.json trace-record.json
      - name: Hash transcript benchmark
        run: sha256sum transcript-benchmark.json > transcript-benchmark.json.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/ctf-tracebook --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctf-tracebook-benchmark-${{ matrix.python-version }}
          path: |
            transcript-benchmark.json
            transcript-benchmark.json.sha256
