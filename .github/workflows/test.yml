name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: CLI version smoke test
        run: ctf-tracebook --version
      - run: python -m unittest discover -s tests -v
      - name: Evaluate transcript fixtures
        run: python scripts/evaluate_transcripts.py benchmarks/transcripts.json --output transcript-benchmark.json --fail-on-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctf-tracebook-benchmark-${{ matrix.python-version }}
          path: transcript-benchmark.json
