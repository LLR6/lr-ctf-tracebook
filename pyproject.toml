[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-ctf-tracebook"
version = "0.1.0"
description = "Offline CTF transcript to redacted reproducible writeup draft"
requires-python = ">=3.10"

[project.scripts]
ctf-tracebook = "tracebook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
