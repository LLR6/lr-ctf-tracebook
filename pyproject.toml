[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-ctf-tracebook"
version = "0.2.0"
description = "Offline CTF transcript to redacted reproducible writeup draft"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LLR6"}]
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
keywords = ["ctf", "writeup", "reproducibility", "redaction", "terminal"]

[project.scripts]
ctf-tracebook = "tracebook.cli:main"

[project.urls]
Homepage = "https://github.com/LLR6/lr-ctf-tracebook"
Repository = "https://github.com/LLR6/lr-ctf-tracebook"
Issues = "https://github.com/LLR6/lr-ctf-tracebook/issues"

[tool.setuptools.packages.find]
where = ["src"]
